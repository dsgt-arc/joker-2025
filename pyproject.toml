[project]
name = "joker-2025"
version = "0.1.1"
authors = [{name = "Russell Taylor", email = "rdtaylorjr@gatech.edu"}, { name = "Ben Herbert", email = "bherbert6@gatech.edu" }, { name = "M. Sana" }]
description = "DS@GT ARC CLEF 2025 JOKER Task 2 (pun translation) system"
readme = "README.md"
requires-python = ">=3.9"
# Not installed via requirements.txt (which only covers the LLM-client stack).
# Needed for src/embeddings.py, src/evaluator.py, src/generator.py, src/preprocessor.py.
dependencies = [
    "faiss-cpu>=1.7.2",
    "ipykernel>=6.29.5",
    "numpy>=2.0.2",
    "pandas",
    "scikit-learn",
    "sentence-transformers",
    "torch>=2.6.0",
    "tqdm>=4.67.1",
]

[project.urls]
Homepage = "https://github.com/dsgt-arc/joker-2025"
Issues = "https://github.com/dsgt-arc/joker-2025/issues"
Joker = "https://www.joker-project.com/"
CLEF = "https://clef2025.clef-initiative.eu/index.php?page=Pages/Labs/JOKER.html"
